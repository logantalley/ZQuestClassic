# 3DS defaults. When the RomFS is staged (packaging/3ds/stage_romfs.py), these
# replace the matching keys of base_config/zc.cfg, so the user's zc.cfg on the
# SD card still overrides them.

[gui]
native_file_dialog = 0

[Controls]
# Used to create the first control scheme, when there is no controls.cfg yet.
# Buttons are allegro gamepad buttons + 1 (SDL's 3DS mapping is by label):
#   1 A, 2 B, 3 X, 4 Y, 5 L, 6 R, 7 Select, 8 Start, 12 ZL, 13 ZR,
#   14-17 D-pad up/down/left/right. The Circle Pad is the left stick.
btn_up = 14
btn_down = 15
btn_left = 16
btn_right = 17
btn_a = 1
btn_b = 2
btn_ex1 = 3
btn_ex2 = 4
btn_l = 5
btn_r = 6
btn_s = 8
btn_m = 7
btn_p = 12
btn_ex3 = 13
btn_ex4 = 0
analog_movement = 1
joystick_index = 0

[zeldadx]
# The top screen is 400x240: the 256x224 game fits at 1x, centered.
fullscreen = 0
window_width = 400
window_height = 240
scaling_mode = 0
scaling_force_integer = 1
vsync = 0
throttlefps = 1
nosound = 0
# No keyboard: name saves with the extended letter grid.
name_entry_mode = 2
clicktofreeze = 0
pause_in_background = 0
ss_enable = 0

[ZSCRIPT]
jit = 0
jit_threads = 0

[CONSOLE]
enabled = 0
